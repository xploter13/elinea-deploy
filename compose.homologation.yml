x-api-networks: &api-networks [backend, egress, mailpit]

services:
  mysql:
    mem_limit: 512m
    cpus: 0.30

  redis:
    mem_limit: 128m
    cpus: 0.10

  api:
    mem_limit: 256m
    cpus: 0.30
    networks: *api-networks

  api-web:
    mem_limit: 48m
    cpus: 0.10

  horizon:
    # Reuse the worker profile; APP_ENV remains staging and Redis stays isolated.
    command: [php, artisan, horizon, --environment=production]
    mem_limit: 128m
    cpus: 0.15
    networks: *api-networks

  scheduler:
    mem_limit: 96m
    cpus: 0.10
    networks: *api-networks

  storefront:
    mem_limit: 256m
    cpus: 0.20

  customer:
    mem_limit: 256m
    cpus: 0.20

  site:
    mem_limit: 48m
    cpus: 0.05

  admin:
    mem_limit: 48m
    cpus: 0.05

  gestao:
    mem_limit: 48m
    cpus: 0.05

networks:
  mailpit:
    name: ${MAILPIT_NETWORK:-mailpit-el1j_default}
    external: true
