server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Resolve generated route directories to their index file before
        # testing $uri. Otherwise Nginx redirects /route to /route/ and the
        # client-side router can lose route state while the SPA boots.
        try_files $uri/index.html $uri $uri.html /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
