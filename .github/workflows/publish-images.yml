name: Publicar imagens

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente das imagens
        required: true
        type: choice
        options:
          - homologation
          - production
      version:
        description: Versão imutável, por exemplo 2026.09.10-1
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validar versão e ambiente
        id: release
        shell: bash
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "A versão contém caracteres inválidos."
            exit 1
          fi

          echo "tag=$RELEASE_ENVIRONMENT-$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Baixar configuração de deploy
        uses: actions/checkout@v4
        with:
          path: workspace/elinea-deploy

      - name: Baixar API
        uses: actions/checkout@v4
        with:
          repository: xploter13/elinea-api
          token: ${{ secrets.REPOSITORIES_TOKEN }}
          path: workspace/elinea-api

      - name: Baixar Storefront
        uses: actions/checkout@v4
        with:
          repository: xploter13/elinea-storefront
          token: ${{ secrets.REPOSITORIES_TOKEN }}
          path: workspace/elinea-storefront

      - name: Baixar SDK
        uses: actions/checkout@v4
        with:
          repository: xploter13/elinea-sdk
          token: ${{ secrets.REPOSITORIES_TOKEN }}
          path: workspace/elinea-sdk

      - name: Baixar UI
        uses: actions/checkout@v4
        with:
          repository: xploter13/elinea-ui
          token: ${{ secrets.REPOSITORIES_TOKEN }}
          path: workspace/elinea-ui

      - name: Preparar contexto dos builds
        run: cp workspace/elinea-deploy/root.dockerignore workspace/.dockerignore

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar API PHP-FPM
        uses: docker/build-push-action@v6
        with:
          context: workspace/elinea-api
          file: workspace/elinea-api/Dockerfile
          target: app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/elinea-api:${{ inputs.environment }}
            ghcr.io/${{ github.repository_owner }}/elinea-api:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=api-app
          cache-to: type=gha,mode=max,scope=api-app

      - name: Publicar Nginx da API
        uses: docker/build-push-action@v6
        with:
          context: workspace/elinea-api
          file: workspace/elinea-api/Dockerfile
          target: web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/elinea-api-web:${{ inputs.environment }}
            ghcr.io/${{ github.repository_owner }}/elinea-api-web:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=api-web
          cache-to: type=gha,mode=max,scope=api-web

      - name: Publicar Storefront
        uses: docker/build-push-action@v6
        with:
          context: workspace
          file: workspace/elinea-deploy/docker/nuxt.Dockerfile
          push: true
          build-args: APP_DIR=elinea-storefront
          tags: |
            ghcr.io/${{ github.repository_owner }}/elinea-storefront:${{ inputs.environment }}
            ghcr.io/${{ github.repository_owner }}/elinea-storefront:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront

